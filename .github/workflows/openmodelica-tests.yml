# Test TAeZoSysPro Examples and Tests models with OpenModelica, using
# ModelicaTests (https://gitlab.pam-retd.fr/thermosysproandco/modelicatests),
# and compare them with a reference version of the library:
#   - pull request: the target branch (master),
#   - push to master: the previous master commit,
#   - manual run: the default branch.
# .test/config_new_openmodelica.json tests the checked out version,
# .test/config_ref_openmodelica.json the reference checked out in
# ref/TAeZoSysPro. The run summary lists, for each model, its status on both
# versions and the changes (fixed, regression, results changed), computed by
# .test/compare_results.py.
#
# Required repository settings (Settings > Secrets and variables > Actions):
#   - secret MODELICATESTS_TOKEN: GitLab token with read_repository access to
#     the ModelicaTests project.
#   - variable OPENMODELICA_IMAGE (optional): OpenModelica Docker image.
#
# Failing models do not fail the workflow: they are reported as annotations,
# in the run summary, and in the uploaded HTML/CSV reports and OpenModelica
# logs. The workflow only fails on infrastructure errors (library or MSL not
# loadable, ModelicaTests crash).

name: OpenModelica tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-openmodelica:
    # Pull requests from forks have no access to secrets, so the private
    # ModelicaTests repository cannot be cloned: skip the job instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.OPENMODELICA_IMAGE || 'openmodelica/openmodelica:v1.26.7-ompython' }}
    steps:
      # git is needed to clone ModelicaTests; python3-venv is used to avoid
      # installing Python packages as root.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3-venv

      # OpenModelica requires the directory containing package.mo to be named
      # after the package, so both checkouts end with TAeZoSysPro. The
      # ModelicaTests git "url" feature cannot be used for the reference: it
      # clones into REPO_<lib>_<n>, which only works when package.mo is in a
      # subdirectory of the repository.
      - name: Checkout TAeZoSysPro
        uses: actions/checkout@v4
        with:
          path: TAeZoSysPro

      - name: Checkout reference TAeZoSysPro
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.event.before || github.base_ref || github.event.repository.default_branch }}
          path: ref/TAeZoSysPro

      - name: Clone ModelicaTests
        env:
          MODELICATESTS_TOKEN: ${{ secrets.MODELICATESTS_TOKEN }}
        run: git clone --depth 1 "https://oauth2:${MODELICATESTS_TOKEN}@gitlab.pam-retd.fr/thermosysproandco/modelicatests.git" modelicatests

      # Copy TAeZoSysPro test configuration files into the ModelicaTests test
      # directory, where the runner expects them.
      - name: Configure ModelicaTests
        run: |
          cp TAeZoSysPro/.test/*.json modelicatests/tests/
          cat > modelicatests/tests/local_config.json <<'JSON'
          {
            "dymola": {
              "egg": "",
              "exe": ""
            },
            "openmodelica": {
              "exe": "/usr/bin/omc"
            }
          }
          JSON

      # Docker jobs run as root. OpenModelica refuses to start its ZMQ server
      # as root, and omc4py needs that server, so the tests run as ciuser.
      - name: Run ModelicaTests
        run: |
          useradd --create-home --shell /bin/bash ciuser
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"
          su ciuser -c "cd '$GITHUB_WORKSPACE/modelicatests' && python3 -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install ."
          su ciuser -c "cd '$GITHUB_WORKSPACE/modelicatests/tests' && . ../.venv/bin/activate && python3 run_cli.py config_ref_openmodelica.json config_new_openmodelica.json --ncpus 4 --timeout 120"

      # Written to a file first: ciuser cannot write to $GITHUB_STEP_SUMMARY.
      - name: Compare with reference
        if: always()
        run: |
          su ciuser -c "cd '$GITHUB_WORKSPACE/modelicatests/tests' && . ../.venv/bin/activate && python3 '$GITHUB_WORKSPACE/TAeZoSysPro/.test/compare_results.py' config_ref_openmodelica.csv config_new_openmodelica.csv > comparison.md"
          cat modelicatests/tests/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelicatests-report
          # TMP_*/<model>/ holds the OpenModelica check, build and simulation
          # logs of each model, needed to understand a failure.
          path: |
            modelicatests/tests/*.csv
            modelicatests/tests/*.html
            modelicatests/tests/*-junit.xml
            modelicatests/tests/comparison.md
            modelicatests/tests/TMP_*/*/*.log
            modelicatests/tests/TMP_*/*/*.txt
          if-no-files-found: warn

      # Only the tested version is reported, not the reference.
      # annotate_only: no separate check run, which GitHub would attach to an
      # arbitrary workflow of the commit and mark as failed. Failing models are
      # annotated on this job and listed in the run summary.
      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: modelicatests/tests/config_new_openmodelica-junit.xml
          annotate_only: true
          fail_on_failure: false
          include_passed: true
          detailed_summary: true
