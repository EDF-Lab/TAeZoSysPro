# Test TAeZoSysPro Examples and Tests models with OpenModelica, using
# ModelicaTests (https://gitlab.pam-retd.fr/thermosysproandco/modelicatests).
#
# Required repository settings (Settings > Secrets and variables > Actions):
#   - secret MODELICATESTS_TOKEN: GitLab token with read_repository access to
#     the ModelicaTests project.
#   - variable OPENMODELICA_IMAGE (optional): OpenModelica Docker image.
#
# Failing models do not fail the workflow: they are reported in the JUnit
# report and in the uploaded HTML/CSV reports. The workflow only fails on
# infrastructure errors (library or MSL not loadable, ModelicaTests crash).

name: OpenModelica tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # needed by the JUnit report action

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-openmodelica:
    # Pull requests from forks have no access to secrets, so the private
    # ModelicaTests repository cannot be cloned: skip the job instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.OPENMODELICA_IMAGE || 'openmodelica/openmodelica:v1.26.7-ompython' }}
    steps:
      # git is needed to clone ModelicaTests; python3-venv is used to avoid
      # installing Python packages as root.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3-venv

      # ModelicaTests names the library after the directory containing
      # package.mo, so the checkout directory must be named TAeZoSysPro.
      - name: Checkout TAeZoSysPro
        uses: actions/checkout@v4
        with:
          path: TAeZoSysPro

      - name: Clone ModelicaTests
        env:
          MODELICATESTS_TOKEN: ${{ secrets.MODELICATESTS_TOKEN }}
        run: git clone --depth 1 "https://oauth2:${MODELICATESTS_TOKEN}@gitlab.pam-retd.fr/thermosysproandco/modelicatests.git" modelicatests

      # Copy TAeZoSysPro test configuration files into the ModelicaTests test
      # directory, where the runner expects them.
      - name: Configure ModelicaTests
        run: |
          cp TAeZoSysPro/.test/*.json modelicatests/tests/
          cat > modelicatests/tests/local_config.json <<'JSON'
          {
            "dymola": {
              "egg": "",
              "exe": ""
            },
            "openmodelica": {
              "exe": "/usr/bin/omc"
            }
          }
          JSON

      # Docker jobs run as root. OpenModelica refuses to start its ZMQ server
      # as root, and omc4py needs that server, so the tests run as ciuser.
      - name: Run ModelicaTests
        run: |
          useradd --create-home --shell /bin/bash ciuser
          chown -R ciuser:ciuser "$GITHUB_WORKSPACE"
          su ciuser -c "cd '$GITHUB_WORKSPACE/modelicatests' && python3 -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install ."
          su ciuser -c "cd '$GITHUB_WORKSPACE/modelicatests/tests' && . ../.venv/bin/activate && python3 run_cli.py config_openmodelica.json --ncpus 4 --timeout 120"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelicatests-report
          path: |
            modelicatests/tests/*.csv
            modelicatests/tests/*.html
            modelicatests/tests/*-junit.xml
          if-no-files-found: warn

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: modelicatests/tests/*-junit.xml
          fail_on_failure: false
          include_passed: true
          detailed_summary: true
